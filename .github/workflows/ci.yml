name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Suite-wide secret-scan gate, one normative source (kontourai/.github).
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: survey

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: survey/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: survey/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: survey

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: survey

      - name: Verify
        run: npm run verify
        working-directory: survey

  docs:
    name: Docs site build and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site and check links
        run: npm run docs:check
