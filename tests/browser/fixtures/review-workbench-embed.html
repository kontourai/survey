<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Survey Review Workbench embed fixture</title>
    <!-- The PACKAGED embed stylesheet, exactly as a downstream host links it
         (@kontourai/survey/review-workbench.css). No token layer is loaded on
         the host page: an embed that carries no working defaults renders dead. -->
    <link rel="stylesheet" href="/dist/src/review-workbench/review-workbench.css">
    <style>
      body { margin: 0; background: #ffffff; }
      #embed { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="embed" class="workbench survey-workbench-embed theme-survey" data-testid="embed">
      <div id="queue"></div>
      <div id="inspector"></div>
    </div>
    <script type="module">
      import { mountReviewWorkbench } from "/dist/src/review-workbench/review-workbench.js";
      import {
        buildExtractionInspectorModel,
        mountExtractionInspector,
      } from "/dist/src/review-workbench/extraction-inspector.js";

      const fixture = window.__surveyEmbedFixture;
      mountReviewWorkbench(document.getElementById("queue"), fixture.session);
      let inspectorModel = buildExtractionInspectorModel(fixture.inspectorEntry);
      if (fixture.stripPublishedHighlightIds) {
        // The pre-2.3.0 authoring shape: a model a caller assembled themselves,
        // with no DOM binding on it. Mount has to render it anyway.
        inspectorModel = {
          sources: inspectorModel.sources,
          candidates: inspectorModel.candidates.map(({ highlightElementId, ...candidate }) => candidate),
        };
      }
      // A host holds the model it mounted; the highlight-anchor contract is a
      // field on it. Exposed here so the spec can resolve every published id
      // against the live DOM the way a consumer does.
      window.__surveyInspectorModel = inspectorModel;
      mountExtractionInspector(
        document.getElementById("inspector"),
        inspectorModel,
        fixture.inspectorPageSize ? { pageSize: fixture.inspectorPageSize } : {},
      );
      document.body.dataset.embedReady = "1";
    </script>
  </body>
</html>
